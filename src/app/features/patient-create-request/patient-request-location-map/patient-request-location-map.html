
<section class="patient-location-card">
  <div class="location-heading">
    <div>
      <strong>Ubicacion de la atencion</strong>
      <span>
        Use su ubicacion actual o seleccione otro punto en el mapa.
      </span>
    </div>

    <button
      type="button"
      class="secondary-button"
      (click)="useCurrentLocation()"
      [disabled]="locating()">
      {{
        locating()
          ? 'Obteniendo ubicacion...'
          : 'Usar mi ubicacion actual'
      }}
    </button>
  </div>

  <div class="map-frame">
    <div
      #mapContainer
      class="map-container">
    </div>

    @if (statusMessage()) {
      <div class="map-placeholder">
        <strong>{{ statusMessage() }}</strong>
      </div>
    }
  </div>

  <div class="location-help">
    <strong>{{ helperMessage() }}</strong>

    <span>
      Puede hacer clic sobre el mapa o arrastrar el marcador.
      La direccion debe ingresarla manualmente en el formulario.
    </span>
  </div>
</section>
